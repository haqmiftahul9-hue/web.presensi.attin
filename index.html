<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <!-- Viewport dikunci agar pas dengan layar smartphone tanpa zoom cubit/double-tap yang membuat layout berantakan -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="SimPres — sistem presensi digital sekolah. Modul Kepegawaian untuk Guru dan Pegawai dapat dipasang sebagai aplikasi." />

  <!-- PWA: manifest + warna tema biru SimPres superadmin (#323d8f) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#323d8f" />
  <meta name="color-scheme" content="light" />

  <!-- Mode standalone untuk iOS -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SIMPEG" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

  <!-- Font (Inter, Plus Jakarta Sans, Material Symbols) dilayani sendiri dari
       /fonts: tidak ada permintaan ke CDN font eksternal, sehingga ikon dan
       teks tetap tampil pada perangkat yang sedang offline. -->
  <title>SIMPEG - Sistem Informasi Kepegawaian</title>
  <script>
    // Mencegah zoom cubit (pinch) dan gesture zoom di iOS Safari agar tampilannya menetap seperti aplikasi mobile native
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
